# crypto-arb-frontend nginx 配置：
# - / → 静态 SPA（Trunk 构建产物）
# - /api/* → 反代到 api:8000
# - /health → 反代到 api:8000
# - /ws → WebSocket 反代到 api:8000

server {
    listen 80;
    server_name _;

    # 启用 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/wasm application/json;
    gzip_min_length 256;

    # 官方 nginx mime.types 已包含 application/wasm。不要在 server 级重定义
    # types，否则会覆盖 text/html、text/css 等完整 MIME 表。

    # 静态资源缓存（hash 命名的资产长期缓存）
    location ~* \.(?:js|wasm|css|png|jpg|svg|ico)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /api/* 反代后端
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /health 反代到 api（便于探针）
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
    }

    # WebSocket 反代（升级头部）
    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s; # 24h，防止 WS 长连超时
    }

    # SPA fallback：未匹配的路径都回退到 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
