services:
  redis:
    image: redis:7-alpine
    container_name: crypto-arb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto-arb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptoarb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cryptoarb"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: crypto-arb-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_LOG_LEVEL: info
      APP_LOG_FORMAT: json
      APP_SECURITY__AUTH_TOKEN: ${APP_SECURITY__AUTH_TOKEN:?set APP_SECURITY__AUTH_TOKEN for docker API}
      APP_SECURITY__ALLOWED_ORIGINS: ${APP_SECURITY__ALLOWED_ORIGINS:?set APP_SECURITY__ALLOWED_ORIGINS as a JSON origin array}
      APP_SECURITY__AUDIT_LOG_PATH: /app/data/security_audit.jsonl
      # Container credential updates stay in memory; inject startup credentials through
      # Docker secrets or the deployment secret manager instead of writing plaintext .env.
      APP_CREDENTIALS__SECRET_BACKEND: runtime
      APP_STORAGE__DATA_DIR: /app/data
      APP_REDIS_URL: redis://redis:6379
      APP_STORAGE__POSTGRES_URL: postgres://app:app@postgres:5432/cryptoarb
      APP_HISTORY__ENABLED: "true"
      APP_HISTORY__OPPORTUNITY_TTL_DAYS: "30"
      APP_HISTORY__POSTGRES_URL: postgres://app:app@postgres:5432/cryptoarb_history
      # 当前产品为 Paper/Live 两模式；Live 下单不再依赖旧全局 readiness。
      # HedgeTicket 只检查当前双腿涉及的交易所凭证、余额、保证金和写单能力。
      # 各交易所私有接口凭证（公共行情可不填；需要余额/持仓/下单时再配置）。
      # BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      # BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      # OKX_API_KEY: ${OKX_API_KEY:-}
      # OKX_API_SECRET: ${OKX_API_SECRET:-}
      # OKX_PASSPHRASE: ${OKX_PASSPHRASE:-}
      # BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      # BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      # BITGET_API_KEY: ${BITGET_API_KEY:-}
      # BITGET_API_SECRET: ${BITGET_API_SECRET:-}
      # BITGET_PASSPHRASE: ${BITGET_PASSPHRASE:-}
      # GATE_API_KEY: ${GATE_API_KEY:-}
      # GATE_API_SECRET: ${GATE_API_SECRET:-}
      # KUCOIN_API_KEY: ${KUCOIN_API_KEY:-}
      # KUCOIN_API_SECRET: ${KUCOIN_API_SECRET:-}
      # KUCOIN_PASSPHRASE: ${KUCOIN_PASSPHRASE:-}
      # HYPERLIQUID_ACCOUNT_ADDRESS: ${HYPERLIQUID_ACCOUNT_ADDRESS:-}
      # HYPERLIQUID_PRIVATE_KEY: ${HYPERLIQUID_PRIVATE_KEY:-}
      # 可选 legacy / 非 P0 扩展凭证（默认 router 关闭）
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 3
          --header "Authorization: Bearer $${APP_SECURITY__AUTH_TOKEN}"
          http://127.0.0.1:8000/health/ready >/dev/null
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: crypto-arb-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto-arb-pgadmin
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  api_data:
  postgres_data:
