# Supply-chain governance for the CROSSLINE Omni trading workspace (PR-BG).
# Enforced in CI via the `supply-chain` job (EmbarkStudios/cargo-deny-action) and
# surfaced locally through scripts/check_supply_chain.sh. Dependency upgrades,
# advisories, and license/source drift must not silently reach the live trading
# system.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Documented exceptions: transitive, unmaintained crates with no safe upgrade
# path today. Tracked under PR-BG; revisit when an upstream replacement lands.
ignore = [
  "RUSTSEC-2025-0012", # backoff (transitive) unmaintained; no safe upgrade
  "RUSTSEC-2024-0384", # instant (transitive) unmaintained; no safe upgrade
  "RUSTSEC-2024-0436", # paste (transitive) unmaintained; no safe upgrade
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are referenced via path with version = "*"; those are
# first-party, not unpinned registry wildcards.
allow-wildcard-paths = true
allow = []
# The trading stack standardises on rustls; native OpenSSL must not creep in.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
