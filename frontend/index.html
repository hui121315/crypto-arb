<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CROSSLINE Omni · 自用套利工作站</title>
    <meta name="theme-color" content="#05080e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305080e'/%3E%3Cpath d='M9 16h14M16 9v14' stroke='%233be8b0' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin />

    <link data-trunk rel="copy-dir" href="public/fonts" data-target-path="fonts" />
    <!-- Tailwind 编译后输出（由 trunk tailwind-css pipeline 生成） -->
    <link data-trunk rel="tailwind-css" href="styles/.generated/input.css" data-config="tailwind.config.cjs" />

    <!-- 显式指定 Rust 二进制 -->
    <link data-trunk rel="rust" data-bin="crypto-arb-frontend" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --converge" />
  </head>
  <body class="bg-ink-950 text-slate-100 antialiased">
    <noscript>该应用需要启用 JavaScript（WASM 加载需要）。</noscript>
  </body>
</html>
